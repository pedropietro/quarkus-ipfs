server {
    listen 9443 ssl;
    # Load the selected certificate on each handshake and leave established streams alone.
    ssl_certificate /fixture/rotation/$server_port/server.pem;
    ssl_certificate_key /fixture/rotation/$server_port/server.key;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_timeout 0;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "te";
        proxy_set_header TE "trailers";
        proxy_pass_trailers on;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 128m;
        proxy_pass http://@KUBO@:5001/;
    }
}

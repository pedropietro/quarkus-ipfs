events {}
http {
    access_log off;
    error_log /dev/stderr warn;
    include /fixture/rotation/*.conf;

    server {
        listen 8443 ssl;
        ssl_certificate /fixture/server.pem;
        ssl_certificate_key /fixture/server.key;

        proxy_http_version 1.1;
        proxy_set_header Connection "te";
        proxy_set_header TE "trailers";
        proxy_pass_trailers on;
        proxy_buffering off;

        location /rpc/ {
            client_max_body_size 128m;
            proxy_request_buffering off;
            proxy_pass http://@KUBO@:5001/;
        }

        location /directory-limit/ {
            proxy_pass http://127.0.0.1:8080/;
        }

        location /late/ {
            proxy_pass http://127.0.0.1:8080/;
        }

        location /stall/ {
            limit_rate 1;
            return 200 "delayed response";
        }

        location /redirect/ {
            return 307 https://redirect-target:8443/capture;
        }

        location = /capture {
            access_log /dev/stdout;
            return 200 "unexpected request";
        }
    }

    server {
        listen 8080;
        location = /ready {
            return 200 "ready";
        }

        location = /api/v0/files/stat {
            default_type application/json;
            return 200 '{"Type":"directory"}';
        }

        location = /api/v0/ls {
            error_page 405 =200 /oversized-listing.json;
            return 405;
        }

        location = /oversized-listing.json {
            internal;
            root /fixture;
        }

        location = /api/v0/add {
            default_type application/json;
            add_trailer X-Stream-Error "fixture pin failure" always;
            return 200 '{"Hash":"bafkreiaabc27q6hpnrclwsa5cnjgzv3uv6zbonq7avwsn6bm2ncdi5fbjq"}';
        }

        location = /api/v0/cat {
            add_header X-Content-Length 7;
            add_trailer X-Stream-Error "fixture read failure" always;
            return 200 "payload";
        }
    }
}

name: Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  jvm:
    name: JVM (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25.0.5+1.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Temurin
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show build tool versions
        run: bash ./mvnw --version

      - name: Build with Maven
        run: python3 -B .github/scripts/maven_verify.py

      - name: Test CI recovery and Central publication
        if: matrix.java == '21'
        run: python3 -B -m unittest discover -s .github/scripts -v

      - name: Verify Kubo interoperability and UnixFS streaming (JVM)
        if: matrix.java != '21'
        timeout-minutes: 8
        run: |
          bash integration-tests/src/test/scripts/kubo-ci.sh jvm \
            integration-tests/target/quarkus-app "$RUNNER_TEMP/kubo-logs"
          bash integration-tests/src/test/scripts/unixfs-stream.sh jvm integration-tests/target/quarkus-app

      - name: Verify the Kubo-only consumer over HTTPS (JVM)
        if: matrix.java != '21'
        timeout-minutes: 12
        run: bash .github/central-consumer/verify.sh --reactor jvm kubo-https

      - name: Upload Kubo JVM logs
        if: always() && matrix.java != '21'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kubo-jvm-logs
          path: ${{ runner.temp }}/kubo-logs/*.log
          if-no-files-found: ignore

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jvm-test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn

  native:
    name: Native (Mandrel 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Temurin
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+1.2'
          cache: maven

      - name: Show build tool versions
        run: bash ./mvnw --version

      - name: Build with Maven (Native)
        id: native-build
        run: |
          builder_image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25
          docker pull "$builder_image"
          builder_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$builder_image")
          echo "Native builder image: $builder_digest"
          echo "builder_image=$builder_digest" >> "$GITHUB_OUTPUT"
          python3 -B .github/scripts/maven_verify.py -pl deployment,integration-tests -am -Dnative \
            -Dquarkus.native.container-build=true "-Dquarkus.native.builder-image=$builder_digest" \
            -Dnative.surefire.skip=true

      - name: Verify Kubo interoperability and UnixFS streaming (native)
        timeout-minutes: 8
        env:
          APP_IMAGE: ${{ steps.native-build.outputs.builder_image }}
        run: |
          shopt -s nullglob
          runners=(integration-tests/target/*-runner)
          if (( ${#runners[@]} != 1 )); then
            echo "::error::Expected exactly one integration-test native executable."
            exit 1
          fi
          bash integration-tests/src/test/scripts/kubo-ci.sh native \
            "${runners[0]}" "$RUNNER_TEMP/kubo-logs"
          bash integration-tests/src/test/scripts/unixfs-stream.sh native "${runners[0]}"

      - name: Verify the Kubo-only consumer over HTTPS (native)
        timeout-minutes: 15
        env:
          QUARKUS_NATIVE_CONTAINER_BUILD: 'true'
          QUARKUS_NATIVE_BUILDER_IMAGE: ${{ steps.native-build.outputs.builder_image }}
        run: bash .github/central-consumer/verify.sh --reactor native kubo-https

      - name: Upload Kubo native logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kubo-native-logs
          path: ${{ runner.temp }}/kubo-logs/*.log
          if-no-files-found: ignore

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-test-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn

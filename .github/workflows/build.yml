name: Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  jvm:
    name: JVM (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25.0.5+1.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Temurin
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show build tool versions
        run: bash ./mvnw --version

      - name: Build with Maven
        run: bash ./mvnw -B clean verify -Dno-format

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jvm-test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn

  native:
    name: Native (Mandrel 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Temurin
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+1.2'
          cache: maven

      - name: Show build tool versions
        run: bash ./mvnw --version

      - name: Build with Maven (Native)
        run: |
          builder_image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25
          docker pull "$builder_image"
          builder_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$builder_image")
          echo "Native builder image: $builder_digest"
          bash ./mvnw -B -pl deployment,integration-tests -am clean verify -Dno-format -Dnative \
            -Dquarkus.native.container-build=true "-Dquarkus.native.builder-image=$builder_digest" \
            -Dnative.surefire.skip=true

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-test-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
